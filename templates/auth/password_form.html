{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
  <div class="card" style="max-width:26rem;margin:0 auto">
    <h2>{{ title }}</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" class="run">
      <label for="password">{{ t('auth_pw_new') }}</label>
      <input id="password" name="password" type="password" required
             minlength="8" autofocus autocomplete="new-password">
      <p><button type="submit">{{ t('auth_pw_btn') }}</button></p>
    </form>
  </div>
{% endblock %}
